name: ci

on:
  push:
  pull_request:

jobs:
  test-and-retrieval-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@127.0.0.1:5442/rag
      FASTAPI_DOCS_COMMIT: ba47d6d71b3e806900c8471f2f661781b8c43ec4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - name: Fetch the FastAPI docs at a pinned commit
        run: |
          git init fastapi-src && cd fastapi-src
          git remote add origin https://github.com/fastapi/fastapi.git
          git sparse-checkout set docs/en/docs docs_src
          git fetch --depth 1 origin "$FASTAPI_DOCS_COMMIT" && git checkout FETCH_HEAD
      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-minilm12
      - run: python -m rag.ingest --docs fastapi-src --reset
      - run: python -m evals.check_questions
      - name: Retrieval eval (fails if hybrid hit@5 drops)
        run: python -m evals.retrieval_eval --k 5 --min-hybrid-hit 0.9
